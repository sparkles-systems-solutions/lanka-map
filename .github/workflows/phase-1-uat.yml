name: Phase 1 UAT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'phase-1/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile UAT
        run: npm run test:uat

      - name: Upload Playwright report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-uat-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
